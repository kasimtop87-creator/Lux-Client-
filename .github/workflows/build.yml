name: Build LUX Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract LUX project
        run: |
          unzip -q LUX-Fabric-1.21.11-phone-build.zip -d extracted
          cp -a extracted/LUX-Fabric-1.21.11/. .

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LUX-Client-1.21.11
          path: build/libs/*.jar
